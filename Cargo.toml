[package]
name = "binpeek"
version = "0.2.1"
edition = "2021"
description = "A fast terminal-based binary file inspector for PE, ELF and Mach-O"
license = "MIT"
keywords = ["binary", "inspector", "pe", "elf", "tui"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/Kleshzz/binpeek"

[dependencies]
goblin = "0.10"
capstone = "0.12"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
