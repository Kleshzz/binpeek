name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  version-bump:
    name: Bump version in Cargo.toml
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace

      - name: Commit and capture SHA
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit -m "chore: bump version to ${GITHUB_REF_NAME}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: version-bump
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: binpeek-windows-x64.exe

          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact: binpeek-windows-x86.exe

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: binpeek-windows-arm64.exe

          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: binpeek-linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: binpeek-linux-arm64

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: binpeek-macos-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: binpeek-macos-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-bump.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libclang-dev
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=/usr/aarch64-linux-gnu"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/binpeek ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: cp target/${{ matrix.target }}/release/binpeek.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: Kleshzz/changelog-writer@v1
        id: changelog
        with:
          tag: ${{ github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/binpeek-windows-x64.exe/binpeek-windows-x64.exe
            artifacts/binpeek-windows-x86.exe/binpeek-windows-x86.exe
            artifacts/binpeek-windows-arm64.exe/binpeek-windows-arm64.exe
            artifacts/binpeek-linux-x64/binpeek-linux-x64
            artifacts/binpeek-linux-arm64/binpeek-linux-arm64
            artifacts/binpeek-macos-x64/binpeek-macos-x64
            artifacts/binpeek-macos-arm64/binpeek-macos-arm64
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## Install

            **Windows**
            Download the binary for your platform, rename to `binpeek` and put it in your `PATH`.
            
            **One-liner (Linux x64)**:
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/binpeek-linux-x64 -o binpeek && chmod +x binpeek && sudo mv binpeek /usr/local/bin/
            ```
            
            **One-liner (macOS ARM64)**:
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/binpeek-macos-arm64 -o binpeek && chmod +x binpeek && sudo mv binpeek /usr/local/bin/
            ```

            **Cargo**
            ```bash
            cargo install binpeek
            ```

  publish:
    name: Publish to crates.io
    needs: [release, version-bump]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_TOKEN }}